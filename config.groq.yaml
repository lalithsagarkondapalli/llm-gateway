# Groq-only config for the real routing eval (free tier works, no credit card needed).
#   Get a key: https://console.groq.com/keys
#   GROQ_API_KEY=gsk_... GATEWAY_CONFIG=config.groq.yaml python -m gateway
#
# Groq retires models often (Llama 3.1 8B / 3.3 70B were shut down 2026-08-16).
# If you get "model ... does not exist", pick current IDs from https://console.groq.com/docs/models
# and override without editing this file:
#   GROQ_SMALL_MODEL=... GROQ_LARGE_MODEL=... bash scripts/verify_mac.sh
#
# Prices: USD per 1K tokens, from Groq's published per-1M pricing
# (gpt-oss-20b: $0.075 in / $0.30 out, gpt-oss-120b: $0.15 in / $0.60 out). Re-check groq.com/pricing.
# Free tier: ~30 requests/min and ~8K tokens/min per model, so evals/run_eval.py paces itself (--rpm).

auth:
  enabled: true
  keys:
    - key: ${GATEWAY_ADMIN_KEY:-sk-admin-dev}
      name: admin
      rate_limit_rpm: 100000
      admin: true

routing:
  strategy: complexity
  complexity_threshold: 0.45
  max_attempts: 2

circuit_breaker:
  failure_threshold: 5
  cooldown_seconds: 20

cache:
  enabled: true
  similarity_threshold: 0.92

providers:
  - name: groq
    type: openai
    base_url: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
    api_key: ${GROQ_API_KEY}
    timeout_seconds: 60

models:
  - name: groq-small
    provider: groq
    upstream_model: ${GROQ_SMALL_MODEL:-openai/gpt-oss-20b}
    tier: small
    input_cost_per_1k: ${GROQ_SMALL_IN_PER_1K:-0.000075}
    output_cost_per_1k: ${GROQ_SMALL_OUT_PER_1K:-0.0003}
  - name: groq-large
    provider: groq
    upstream_model: ${GROQ_LARGE_MODEL:-openai/gpt-oss-120b}
    tier: large
    input_cost_per_1k: ${GROQ_LARGE_IN_PER_1K:-0.00015}
    output_cost_per_1k: ${GROQ_LARGE_OUT_PER_1K:-0.0006}
