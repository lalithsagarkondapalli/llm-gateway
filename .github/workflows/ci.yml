name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest --cov=gateway --cov-report=term-missing --cov-fail-under=85

  docker:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t llm-gateway .
      - name: Smoke test container
        run: |
          docker run -d -p 8000:8000 --name gw llm-gateway
          for i in $(seq 1 20); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf localhost:8000/v1/chat/completions \
            -H "Authorization: Bearer sk-demo-dev" -H "Content-Type: application/json" \
            -d '{"messages":[{"role":"user","content":"hello"}]}'
